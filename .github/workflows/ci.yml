name: Rinemi2 CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: node --check scripts/smoke-deployment.mjs
      - run: node --check public/sw.js
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:contrast
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm run e2e:offline
      - run: npm run build:pages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rinemi2-browser-evidence
          path: |
            artifacts/*.png
            test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 14
