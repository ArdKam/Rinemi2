name: Deploy Rinemi 2 to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate deployment smoke test syntax
        run: node --check scripts/smoke-deployment.mjs

      - name: Run data and unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Verify design-token contrast
        run: npm run check:contrast

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end browser tests
        run: npm run e2e

      - name: Build the GitHub Pages artifact
        run: npm run build:pages

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Check out smoke test
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy the Vite artifact
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke-test the live deployment
        run: node scripts/smoke-deployment.mjs "${{ steps.deployment.outputs.page_url }}"
