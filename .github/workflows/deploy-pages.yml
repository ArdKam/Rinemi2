name: Deploy Rinemi 2 to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate deployment smoke test syntax
        run: node --check scripts/smoke-deployment.mjs

      - name: Validate service-worker syntax
        run: node --check public/sw.js

      - name: Run data and unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Verify design-token contrast
        run: npm run check:contrast

      # The dedicated CI workflow runs the local Playwright and warm-cache offline
      # suites on this same commit. Keep this job focused on producing the Pages
      # artifact; the deploy job below still runs live Chromium against the deployed URL.
      - name: Build the GitHub Pages artifact
        run: npm run build:pages

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out smoke test
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies for live browser verification
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for live browser verification
        run: npx playwright install --with-deps chromium

      - name: Deploy the Vite artifact
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke-test the live deployment
        run: node scripts/smoke-deployment.mjs "${{ steps.deployment.outputs.page_url }}"

      - name: Verify the live React application in Chromium
        env:
          RINEMI_DEPLOY_URL: ${{ steps.deployment.outputs.page_url }}
        run: npx playwright test --config=playwright.preview.config.ts

      - name: Upload live-preview browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rinemi2-live-preview-evidence
          path: artifacts/live-preview-*.png
          if-no-files-found: ignore
          retention-days: 14
