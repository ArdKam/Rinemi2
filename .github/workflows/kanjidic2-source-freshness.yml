name: KANJIDIC2 source freshness

on:
  schedule:
    # Monthly source-version checkpoint; humans still decide whether the app's
    # curated 2,136-entry Jōyō subset requires a reviewed update.
    - cron: "17 9 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: kanjidic2-source-freshness
  cancel-in-progress: false

jobs:
  check-upstream:
    name: Check official KANJIDIC2 source snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source records
        uses: actions/checkout@v4

      - name: Test the freshness audit parser
        run: python3 scripts/test_kanjidic2_freshness.py

      - name: Fetch authoritative source and licence pages
        env:
          KANJIDIC2_PROJECT_URL: https://www.edrdg.org/wiki/KANJIDIC_Project.html
          EDRDG_LICENCE_URL: https://www.edrdg.org/edrdg/licence.html
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 90 \
            "$KANJIDIC2_PROJECT_URL" --output "$RUNNER_TEMP/kanjidic2-project.html"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 90 \
            "$EDRDG_LICENCE_URL" --output "$RUNNER_TEMP/edrdg-licence.html"
          grep -qi "KANJIDIC2" "$RUNNER_TEMP/kanjidic2-project.html"
          grep -qi "Updating Dictionary Versions" "$RUNNER_TEMP/edrdg-licence.html"

      - name: Download and validate the current KANJIDIC2 snapshot
        id: snapshot
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 \
            "https://www.edrdg.org/kanjidic/kanjidic2.xml.gz" \
            --output "$RUNNER_TEMP/kanjidic2.xml.gz"
          gzip --test "$RUNNER_TEMP/kanjidic2.xml.gz"
          python3 scripts/check-kanjidic2-freshness.py "$RUNNER_TEMP/kanjidic2.xml.gz" >> "$GITHUB_OUTPUT"

      - name: Record monthly source-freshness audit
        uses: actions/github-script@v7
        env:
          DATABASE_VERSION: ${{ steps.snapshot.outputs.database_version }}
          FILE_VERSION: ${{ steps.snapshot.outputs.file_version }}
          CHARACTER_COUNT: ${{ steps.snapshot.outputs.character_count }}
          SNAPSHOT_SHA256: ${{ steps.snapshot.outputs.snapshot_sha256 }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = 25;
            const marker = "<!-- rinemi-kanjidic2-freshness-check -->";
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const previousChecks = comments
              .filter(comment => comment.body?.includes(marker))
              .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
            const previous = previousChecks[0];
            const previousHash = previous?.body?.match(/Snapshot SHA-256: `([a-f0-9]{64})`/i)?.[1] ?? null;
            const currentHash = process.env.SNAPSHOT_SHA256;
            const changed = previousHash !== null && previousHash !== currentHash;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const checkedAt = new Date().toISOString();
            const comparison = previousHash === null
              ? "No previous automated digest was found. Treat this as the initial recorded source baseline and compare the app’s exact upstream lineage before release."
              : changed
                ? "⚠️ The raw upstream snapshot SHA-256 differs from the preceding recorded check. Review the XML/source delta and decide whether the curated 2,136-entry app subset should be regenerated."
                : "The raw upstream snapshot SHA-256 matches the preceding recorded check. This does not prove that the bundled 2,136-entry app subset matches the current source revision.";
            const body = [
              marker,
              "## Monthly KANJIDIC2 source-freshness check",
              "",
              `- **Checked (UTC):** ${checkedAt}`,
              "- **Official project page:** https://www.edrdg.org/wiki/KANJIDIC_Project.html",
              "- **Official licence statement:** https://www.edrdg.org/edrdg/licence.html",
              "- **Downloaded source:** https://www.edrdg.org/kanjidic/kanjidic2.xml.gz",
              `- **Database version:** ${process.env.DATABASE_VERSION}`,
              `- **File/schema version:** ${process.env.FILE_VERSION}`,
              `- **Character records in source:** ${process.env.CHARACTER_COUNT}`,
              `- **Snapshot SHA-256:** \`${currentHash}\``,
              `- **Workflow evidence:** [run ${context.runNumber}](${runUrl})`,
              "",
              comparison,
              "",
              "**Important boundary:** this automation fingerprints and validates the upstream source only. It does not modify Rinemi’s bundled data, certify the provenance of the current 2,136-entry subset, determine legal compliance, or close this issue. A human must compare the source revision/delta, review required attribution/share-alike treatment, regenerate only through an approved transformation, and run the project’s data and UI acceptance checks before adopting any update."
            ].join("\n");
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
            await core.summary
              .addHeading("KANJIDIC2 source-freshness check")
              .addTable([
                [{data:"Field",header:true},{data:"Value",header:true}],
                ["Database version", process.env.DATABASE_VERSION],
                ["Schema/file version", process.env.FILE_VERSION],
                ["Character records", process.env.CHARACTER_COUNT],
                ["SHA-256", currentHash],
                ["Previous digest changed", previousHash === null ? "No baseline yet" : String(changed)]
              ])
              .addLink("Issue #25 audit entry", `https://github.com/${owner}/${repo}/issues/25`)
              .write();
