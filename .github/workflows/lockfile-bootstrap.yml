name: Bootstrap npm lockfile (temporary branch tool)

on:
  push:
    branches:
      - tooling/lockfile-bootstrap
    paths-ignore:
      - package-lock.json

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the lockfile branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit generated lockfile on this isolated tooling branch
        run: |
          if git diff --quiet -- package-lock.json && test -f package-lock.json; then
            echo "package-lock.json is already up to date."
            exit 0
          fi
          git add package-lock.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "build: generate npm lockfile"
          git push origin HEAD:tooling/lockfile-bootstrap
